name: VercelSim
on:
  push:
    branches: [vercel-sim]
jobs:
  sim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-fund --no-audit
      - run: npx web-push generate-vapid-keys --json > v.json
      - run: |
          export VERCEL=1 CI=1 VERCEL_ENV=preview NODE_ENV=production
          export NEXT_PUBLIC_SUPABASE_URL=https://abcdefgh.supabase.co SUPABASE_ANON_KEY=x NEXT_PUBLIC_SUPABASE_ANON_KEY=x SUPABASE_SERVICE_ROLE_KEY=x
          export NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(node -p "require('./v.json').publicKey") VAPID_PRIVATE_KEY=$(node -p "require('./v.json').privateKey") VAPID_SUBJECT=mailto:a@b.co
          export AUTH_HASH_SECRET=x STRIPE_SECRET_KEY=sk_test_x NEXT_PUBLIC_TURNSTILE_SITE_KEY=x TURNSTILE_SECRET_KEY=x
          npx next build 2>&1 | tail -80
          exit ${PIPESTATUS[0]}
